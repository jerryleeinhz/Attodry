# Copy this file to hardware.local.toml and edit it on the control computer.
# hardware.local.toml is ignored by git.

[project]
mode = "hardware"
database_path = "C:/CHANGE_ME/attodry_control.sqlite"

[cryostat]
backend = "legacy_dll"
com_port = "CHANGE_ME_COM_PORT"
dll_path = "C:/CHANGE_ME/attoDRYxyz64bit.dll"
device_type = 1
connection_timeout_s = 60.0
temperature_min_k = 1.6
temperature_max_k = 300.0

[magnet]
# Controller X is the transverse coil called Y in the factory magnet table.
hardware_x_max_t = 3.0
hardware_z_max_t = 9.0
# User-confirmed experiment limit, including pure-X and pure-Z commands.
experiment_vector_max_t = 3.0
field_tolerance_t = 0.001
stable_range_t = 0.0005
stable_dwell_s = 10.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[temperature_stability]
tolerance_k = 0.01
stable_range_k = 0.005
stable_dwell_s = 30.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[cleanup]
normal_end_field_policy = "hold"
exception_field_policy = "zero"

[visa]
backend = "default"
timeout_ms = 5000

[lockin_xx]
model = "SR830"
address = "CHANGE_ME_SR830_XX_VISA_ADDRESS"
reference_source = "internal"
sine_output_connected = true
source_voltage_v = 0.004
frequency_hz = 17.777

[lockin_xy]
model = "SR830"
address = "CHANGE_ME_SR830_XY_VISA_ADDRESS"
reference_source = "external_ttl"
sine_output_connected = false
# SR830 has no software output-off command. Keep the physically disconnected
# SINE OUT at the minimum configured amplitude.
source_voltage_v = 0.004
frequency_hz = 17.777

[gate_top]
model = "CHANGE_ME"
address = "CHANGE_ME_TOP_GATE_VISA_ADDRESS"
compliance_a = "CHANGE_ME"
leakage_limit_a = "CHANGE_ME"
max_abs_voltage_v = "CHANGE_ME"
ramp_step_v = "CHANGE_ME"
readback_tolerance_v = "CHANGE_ME"
settle_s = "CHANGE_ME"

[gate_bottom]
model = "CHANGE_ME"
address = "CHANGE_ME_BOTTOM_GATE_VISA_ADDRESS"
compliance_a = "CHANGE_ME"
leakage_limit_a = "CHANGE_ME"
max_abs_voltage_v = "CHANGE_ME"
ramp_step_v = "CHANGE_ME"
readback_tolerance_v = "CHANGE_ME"
settle_s = "CHANGE_ME"

# Three-SMU module additions.  Copy this entire file to hardware.local.toml.
# The two gate tables above remain the only source of gate voltage, leakage,
# compliance, ramp, readback, and settle limits.

[smu_bias]
model = "Keithley2400"
address = "CHANGE_ME_BIAS_SMU_VISA_ADDRESS"
timeout_ms = "CHANGE_ME"
# "voltage" uses source_min/source_max/ramp_step in V and requires
# compliance_current_a.  "current" uses those fields in A and requires
# compliance_voltage_v.
source_mode = "voltage"
compliance_current_a = "CHANGE_ME"
compliance_voltage_v = "CHANGE_ME"
source_min = "CHANGE_ME"
source_max = "CHANGE_ME"
ramp_step = "CHANGE_ME"
readback_tolerance = "CHANGE_ME"
settle_s = "CHANGE_ME"
nplc = "CHANGE_ME"
source_auto_range = true
measure_auto_range = true
four_wire = false

[gate_top.smu]
# Keithley-2400-specific fields only; shared safety limits stay in [gate_top].
timeout_ms = "CHANGE_ME"
nplc = "CHANGE_ME"
source_auto_range = true
measure_auto_range = true
four_wire = false

[gate_bottom.smu]
# Keithley-2400-specific fields only; shared safety limits stay in [gate_bottom].
timeout_ms = "CHANGE_ME"
nplc = "CHANGE_ME"
source_auto_range = true
measure_auto_range = true
four_wire = false

[three_smu_run]
# A relative output_directory is relative to this TOML file.
output_directory = "../data/three_smu"
run_name = "CHANGE_ME_RUN_NAME"
note = ""
mode = "bias_iv"
samples_per_point = 1
delay_s = 0.1
bidirectional = false
serpentine = false
finish_action = "zero_disable"
point_count = 1
pulse_high_s = 0.0
pulse_period_s = 0.0

[three_smu_run.smu_bias]
role = "sweep"
fixed = 0.0
start = "CHANGE_ME"
stop = "CHANGE_ME"
step = "CHANGE_ME"

[three_smu_run.gate_top]
role = "off"
fixed = 0.0
start = 0.0
stop = 0.0
step = 1.0

[three_smu_run.gate_bottom]
role = "off"
fixed = 0.0
start = 0.0
stop = 0.0
step = 1.0
