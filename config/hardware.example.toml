# Copy this file to hardware.local.toml and edit it on the control computer.
# hardware.local.toml is ignored by git.
# Daily Lock-in sweeps automatically read the versioned lockin_safety.toml file
# beside this file; validate-config is optional and is not a run prerequisite.

[project]
mode = "hardware"
database_path = "C:/CHANGE_ME/attodry_control.sqlite"

[cryostat]
backend = "legacy_dll"
com_port = "CHANGE_ME_COM_PORT"
dll_path = "C:/CHANGE_ME/attoDRYxyz64bit.dll"
device_type = 1
connection_timeout_s = 60.0
temperature_min_k = 1.6
temperature_max_k = 300.0

[magnet]
# Controller X is the transverse coil called Y in the factory magnet table.
hardware_x_max_t = 3.0
hardware_z_max_t = 9.0
# User-confirmed experiment limit, including pure-X and pure-Z commands.
experiment_vector_max_t = 3.0
field_tolerance_t = 0.001
stable_range_t = 0.0005
stable_dwell_s = 10.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[temperature_stability]
tolerance_k = 0.01
stable_range_k = 0.005
stable_dwell_s = 30.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

# Daily temperature operation. Normally only target_k needs to change.
[temperature_run]
target_k = 1.8
max_delta_k = 250.0
max_overshoot_k = 0.2
pre_measure_wait_s = 1800.0
poll_interval_s = 1.0

[cleanup]
normal_end_field_policy = "hold"
exception_field_policy = "zero"

[visa]
backend = "default"
timeout_ms = 5000

[lockin_xx]
model = "SR830"
# Keep the station-specific VISA address only in ignored hardware.local.toml.
address = "CHANGE_ME_SR830_XX_VISA_ADDRESS"
reference_source = "internal"
sine_output_connected = true
source_voltage_v = 0.004
frequency_hz = 17.777
input_mode = "a_minus_b"
shield_grounding = "float"
input_coupling = "ac"
time_constant_s = 0.3
filter_slope_db_oct = 24
# Station template requested for the current run: fixed XX at 1 V full scale
# (SENS 26). To opt into the approved three-level bounded_auto ladder, change
# sensitivity_mode, set the minimum, then uncomment every autorange field below.
# It widens only as 10 -> 20 -> 50 mV; a 1 V fixed range is not part of that ladder.
sensitivity_mode = "fixed"
sensitivity_full_scale_v = 1.0
# Dynamic reserve: "high_reserve", "normal", or "low_noise". The checked-in
# safety policy currently permits only "normal" for daily sweeps.
reserve_mode = "normal"
# autorange_min_full_scale_v = 0.010
# autorange_max_full_scale_v = 0.050
# autorange_target_occupancy = 0.85
# autorange_stable_samples = 2
# A sweep's settle_s must be at least this multiplier times time_constant_s.
# At the confirmed 0.3 s and 5.0 values, that lower bound is 1.5 s.
settle_time_constants = 5.0

[lockin_xy]
model = "SR830"
# Keep the station-specific VISA address only in ignored hardware.local.toml.
address = "CHANGE_ME_SR830_XY_VISA_ADDRESS"
reference_source = "external_ttl"
external_reference_edge = "rising"
sine_output_connected = false
# SR830 has no software output-off command. Keep the physically disconnected
# SINE OUT at the minimum configured amplitude.
source_voltage_v = 0.004
frequency_hz = 17.777
input_mode = "a_minus_b"
shield_grounding = "float"
input_coupling = "ac"
time_constant_s = 0.3
filter_slope_db_oct = 24
sensitivity_mode = "fixed"
sensitivity_full_scale_v = 0.010
# Dynamic reserve: "high_reserve", "normal", or "low_noise". The checked-in
# safety policy currently permits only "normal" for daily sweeps.
reserve_mode = "normal"
# To opt into bounded_auto for XY, change sensitivity_mode, set
# sensitivity_full_scale_v to the selected minimum, and uncomment every field
# below. The documented XY auto pair is 1 mV to 10 mV. XY SINE OUT remains
# physically disconnected regardless of range mode.
# autorange_min_full_scale_v = 0.001
# autorange_max_full_scale_v = 0.010
# autorange_target_occupancy = 0.85
# autorange_stable_samples = 2
# A sweep's settle_s must be at least this multiplier times time_constant_s.
# At the confirmed 0.3 s and 5.0 values, that lower bound is 1.5 s.
settle_time_constants = 5.0

[lockin_sweep]
# Range tables expand to inclusive, strictly increasing points before VISA opens.
# Linear ranges require min/max plus exactly one of step or points. Log ranges
# require min/max/points.
frequency_ranges = [
  { min = 17.777, max = 100000.0, scale = "log", points = 10 },
]
# Fixed XX SINE OUT RMS amplitude used throughout a frequency sweep. The sweep
# restores the separate 4 mVrms safety baseline after it finishes.
frequency_source_voltage_v_rms = 0.004
# A range may optionally override each role's fixed full scale at its segment.
# Omit xx_full_scale_v/xy_full_scale_v to use [lockin_xx]/[lockin_xy] settings.
# Example with two disjoint segments and an XX-only fixed-range override:
# excitation_ranges = [
#   { min = 0.004, max = 0.040, scale = "linear", step = 0.004, xx_full_scale_v = 0.010 },
#   { min = 0.050, max = 0.400, scale = "log", points = 8 },
# ]
excitation_ranges = [
  { min = 0.004, max = 0.400, scale = "linear", points = 11 },
  { min = 0.45, max = 5.0, scale = "linear", points = 21 },
]
# Select formal curves separately for every scan and voltage role. Each list is
# ascending and uses 1, 2, and/or 3; [] excludes that role from formal curves
# while retaining its paired readback and every safety check. At least one role
# must be selected for each scan. Example: XX h1/h3 and XY h2 in a frequency scan.
frequency_xx_harmonics = [1, 2, 3]
frequency_xy_harmonics = [1, 2, 3]
excitation_xx_harmonics = [1]
excitation_xy_harmonics = [1, 2, 3]
# At high fundamental frequencies, retain supported orders and record skipped ones.
skip_unsupported_harmonics = true
# Range mode and target/policy belong to [lockin_xx] and [lockin_xy], not this
# sweep table. Both roles default to fixed mode above; bounded_auto is opt-in.
# Edit these two audit fields before every run. The run name is also included in
# the JSON filename; the note is preserved inside the JSON record.
run_name = "test145degree"
note = "45degree"
settle_s = 1.5
samples_per_point = 3
sample_interval_s = 0.3
external_series_resistance_ohm = 100000.0
approximate_device_resistance_ohm = 100.0
# Confirm this upper bound for every device state. It is used to calculate the
# fail-closed device-terminal voltage from the SINE OUT divider, not as an average.
maximum_device_resistance_ohm = 150.0
max_device_current_a_rms = 0.005
max_device_voltage_v_rms = 0.5
external_50_ohm_termination = false
# Relative to this TOML. With hardware.local.toml in config/, this is the
# repository's existing default discovery directory for the analysis notebooks.
output_directory = "../run_data/commissioning"


[gate_top]
model = "CHANGE_ME"
address = "CHANGE_ME_TOP_GATE_VISA_ADDRESS"
compliance_a = "CHANGE_ME"
leakage_limit_a = "CHANGE_ME"
max_abs_voltage_v = "CHANGE_ME"
ramp_step_v = "CHANGE_ME"
readback_tolerance_v = "CHANGE_ME"
settle_s = "CHANGE_ME"

[gate_bottom]
model = "CHANGE_ME"
address = "CHANGE_ME_BOTTOM_GATE_VISA_ADDRESS"
compliance_a = "CHANGE_ME"
leakage_limit_a = "CHANGE_ME"
max_abs_voltage_v = "CHANGE_ME"
ramp_step_v = "CHANGE_ME"
readback_tolerance_v = "CHANGE_ME"
settle_s = "CHANGE_ME"
