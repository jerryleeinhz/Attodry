# OPTIONAL SIMULATION FRAGMENT. Append to photoresponse_simulation.toml or
# photoresponse_cld_simulation.toml in an ignored local file. Do not duplicate tables.
# For hardware reuse the station's confirmed cryostat/magnet/temperature_stability
# tables and supply approved explicit points and step bounds below.
[cryostat]
backend = "simulation"
temperature_min_k = 1.6
temperature_max_k = 300.0

[magnet]
hardware_x_max_t = 3.0
hardware_z_max_t = 9.0
experiment_vector_max_t = 3.0
field_tolerance_t = 0.001
stable_range_t = 0.0005
stable_dwell_s = 10.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[temperature_stability]
tolerance_k = 0.01
stable_range_k = 0.005
stable_dwell_s = 30.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[photoresponse_environment]
max_field_step_t = 0.01
max_temperature_step_k = 1.0
max_temperature_overshoot_k = 0.2
normal_end_field_policy = "hold" # zero on exception, regardless of this setting
points = [
  {temperature_k = 1.6, bx_t = 0.0, bz_t = 0.0},
  {temperature_k = 2.0, bx_t = 0.01, bz_t = 0.02},
]
