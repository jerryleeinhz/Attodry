# OFFLINE ONLY. These are synthetic coordinates, not an authorized device plan.
# Array order = outer-to-inner. Omit inactive modules; use one point for fixed.
# Magnetic X/Z is one atomic ordered-point axis, never two Cartesian axes.
[combination_scan]
backend = "simulation"
run_name = "smu_outer_lockin_inner"
note = "Synthetic regrouping regression; not sample data"
samples_per_condition = 1
repeats = 1

[[combination_scan.axes]]
module = "smu"
points = [
  { values = { smu_bias_v = -0.1 }, segment = "forward", direction = "ascending" },
  { values = { smu_bias_v = 0.0 }, segment = "forward", direction = "ascending" },
  { values = { smu_bias_v = 0.1 }, segment = "forward", direction = "ascending" },
]

[[combination_scan.axes]]
module = "lockin"
points = [
  { values = { lockin_excitation_v_rms = 0.004, lockin_frequency_hz = 17.0 } },
  { values = { lockin_excitation_v_rms = 0.008, lockin_frequency_hz = 17.0 } },
]

