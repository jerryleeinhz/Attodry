# OFFLINE ONLY. Reuses the existing synthetic environmental configuration.
[combination_scan]
backend = "simulation"
order = ["temperature", "magnetic", "nanovoltmeter"]
samples_per_condition = 3
repeats = 1
run_name = "modular_environment_offline"
note = "Independent 2 temperatures x 2 magnetic vectors; no laser/source."
output_directory = "../run_data/modular_environment_simulation"

[measurement]
max_abs_voltage_v = 0.01
sample_interval_s = 0.01
settle_s = 0.01

[temperature_scan]
points_k = [1.6, 2.0]

[magnetic_scan]
points = [{bx_t=0.0,bz_t=0.0}, {bx_t=0.01,bz_t=0.02}]
# Independent vector component grid is also supported, with pattern="cartesian"
# or "paired". Do not combine points with bx_points_t / bz_points_t.

[nanovoltmeter]
model = "keithley2182a"
channel = 2
voltage_range_v = 10.0
nplc = 1.0

[environment]
max_field_step_t = 0.01
max_temperature_step_k = 1.0
max_temperature_overshoot_k = 0.2
normal_end_field_policy = "hold" # Failure still requests zero, verifies and records.

[cryostat]
backend = "simulation"
temperature_min_k = 1.6
temperature_max_k = 300.0

[magnet]
hardware_x_max_t = 3.0
hardware_z_max_t = 9.0
experiment_vector_max_t = 3.0
field_tolerance_t = 0.001
stable_range_t = 0.0005
stable_dwell_s = 10.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0

[temperature_stability]
tolerance_k = 0.01
stable_range_k = 0.005
stable_dwell_s = 30.0
poll_interval_s = 1.0
wait_timeout_s = 7200.0
