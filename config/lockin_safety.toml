schema_version = 1

# Project safety policy for SR830 sweeps.  The code also keeps non-editable
# SR830 hardware limits; this file controls the narrower project allowlist.
minimum_source_voltage_v_rms = 0.004
maximum_source_voltage_v_rms = 5.0
cleanup_source_voltage_v_rms = 0.004
minimum_settle_time_constants = 5.0
target_occupancy = 0.85
stable_samples_before_narrowing = 2

[lockin_xx]
allowed_fixed_full_scales_v = [0.001, 0.010, 0.020, 0.050]
autorange_ladders_v = [
  [0.010, 0.020],
  [0.020, 0.050],
  [0.010, 0.020, 0.050],
]

[lockin_xy]
allowed_fixed_full_scales_v = [0.001, 0.010, 0.020, 0.050]
autorange_ladders_v = [
  [0.001, 0.010],
]
