# OFFLINE ONLY. Synthetic limits/model; never copy these limits to hardware.
# python -m attodry_control.combination_cli simulate --config config/modular_optics_simulation.toml
[combination_scan]
backend = "simulation"
order = ["optics", "nanovoltmeter"] # Left outer; right inner. Omitted modules are inactive.
samples_per_condition = 3
repeats = 1
run_name = "modular_optics_offline"
note = "Synthetic optical power grid; not calibrated optical/sample response."
output_directory = "../run_data/modular_optics_simulation"
database_path = "../run_data/modular_optics_simulation/audit.sqlite"

[measurement]
max_abs_voltage_v = 0.01
sample_interval_s = 0.01
settle_s = 0.01
dark_recovery_s = 0.02

[optics]
laser = "nkt"
use_pem = false # Optional PEM lives inside optics, not a second laser axis.
use_power_meter = true # PM100D feedback; a percentage setting is not measured W.
mode = "power_stabilized"
initial_source_level_pct = 2.8 # Synthetic seed; previous valid same-wave setting may be reused.

[optics_scan]
order = ["wavelength", "bandwidth", "power"]
wavelength_points_nm = [594.4, 630.0]
# Single wavelength: wavelength_points_nm = [630.0].
# Or REPLACE that array with this generator (never define both):
# wavelength_ranges_nm = [{min=530.0,max=820.0,scale="linear",points=10}]
bandwidth_points_nm = [10.0]
power_points_w = [20e-6, 55e-6, 75e-6]
# Or REPLACE power_points_w:
# power_ranges_w = [{min=10e-6,max=90e-6,scale="linear",points=9}]
dark_first = true # One dark per wavelength/bandwidth visit; matched subtraction.

[nanovoltmeter]
model = "keithley2182a"
channel = 2
voltage_range_v = 10.0
nplc = 1.0
analog_lowpass_enabled = false
autozero = true
front_autozero = true

[nanovoltmeter.digital_filter]
enabled = false
type = "repeating" # moving / repeating; instrument filter, not software sample count.
count = 10
window_percent = 1.0 # Percent of voltage range, not optical tolerance.

[nkt_source]
control = "current"
apply_control = true
max_level_pct = 100.0
allowed_pp_ratios = []

[nkt_varia]
monitor_present = false

[nkt_run]
backend = "simulation"
mode = "varia_bandpass"
manual_route = "SIMULATED VARIA route"
emit = true
timeout_s = 5.0
poll_interval_s = 0.1
dwell_s = 0.0 # Settling belongs to measurement/feedback, not a duplicate device wait.
output_directory = "../run_data/modular_optics_simulation"
run_name = "modular_optics_offline"
note = "Synthetic device; actual run metadata comes from combination_scan."
# No nkt_run.points needed: optics_scan is the only point source.

[pm100d]
backend = "simulation"
io_timeout_s = 1.0
wavelength_tolerance_nm = 0.1
average_count = 1
auto_range = true
max_power_w = 0.003
measurement_plane = "SIMULATED reference monitor; not sample calibration"

[power_feedback]
actuator = "source_current"
# Targets exist ONLY in optics_scan, never duplicate target_* / power_points here.
initial_actuator_mode = "previous"
tuning_tolerance_fraction = 0.05
target_tolerance_fraction = 0.10
max_power_w = 0.0025
minimum_signal_power_w = 1e-7
source_current_min_pct = 0.1
source_current_max_pct = 20.0
source_current_step_pct = 3.0
timeout_s = 30.0
hold_s = 0.05 # Synthetic timing; not a physical recommendation.
max_retries = 2
point_timeout_s = 60.0

[power_feedback.window]
duration_s = 0.5 # Covers Windows journal/SQLite guard overhead; 20 ms caused proof gaps.
min_samples = 3
sample_interval_s = 0.05
max_peak_to_peak_w = 5e-6
max_peak_to_peak_fraction = 0.05
noise_floor_w = 0.0
max_drift_fraction_per_s = 0.002
