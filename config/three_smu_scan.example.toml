# Copy to three_smu_scan.local.toml and replace these illustrative scan values
# only after checking them against operator-confirmed hardware limits.

[scan]
mode = "bias_iv"
samples_per_point = 1
delay_s = 0.1
bidirectional = false
serpentine = false
finish_action = "zero_disable"
point_count = 1
pulse_high_s = 0.0
pulse_period_s = 0.0

[smu_bias]
role = "sweep"
fixed = 0.0
start = -0.001
stop = 0.001
step = 0.0001

[gate_top]
role = "off"
fixed = 0.0
start = 0.0
stop = 0.0
step = 1.0

[gate_bottom]
role = "off"
fixed = 0.0
start = 0.0
stop = 0.0
step = 1.0
