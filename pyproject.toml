[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attodry-transport-control"
version = "0.1.0"
description = "Safety-first attoDRY transport control and DC photoresponse acquisition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["pyvisa==1.16.2", "qcodes>=0.47,<1"]
analysis = ["matplotlib==3.10.9"]

[project.scripts]
attodry-photoresponse = "attodry_control.photoresponse_cli:main"
attodry-nkt-test = "attodry_control.nkt_test:main"
attodry-lockin-test = "attodry_control.lockin_test:main"
attodry-cryostat-test = "attodry_control.attodry_test:main"
attodry-temperature-test = "attodry_control.temperature_test:main"
attodry-temperature-run = "attodry_control.temperature_run:main"
attodry-temperature-scan = "attodry_control.temperature_scan:main"
attodry-monitor = "attodry_control.monitor:main"
attodry-analyze = "attodry_control.analysis:main"
attodry-simulate = "attodry_control.simulate:main"
attodry-three-smu = "attodry_control.three_smu_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
