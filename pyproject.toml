[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attodry-transport-control"
version = "0.1.0"
description = "Safety-first transport control scaffold for attoDRY2100XL and dual SR830 lock-ins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

